<!DOCTYPE html>
<html lang = "en">

  <style type="text/css" media="screen">
    #table {
      position: absolute;
      top: 30px;
      bottom: 0;
      left: 10px;
      right: 10px;
    }
    #header {
      position: absolute;
      top: 0;
      height: 25px;
      left: 10px;
      right: 10px;
      font-weight: bold;
      font-size: 20px;
      border-bottom: solid 1px #444;
    }
    .title {
      height: 30px;
      width: 100px;
      border-right: 1px solid black;
    }
    .desc {
      height: 30px;
      width: 200px;
      position: absolute;
      left: 120px;
      top: 0px;
      font-family: italic;
      color: #444;
      border-right: 1px solid black;
    }
    .resizer {
      /* Displayed at the right side of column */
      position: absolute;
      top: 0;
      right: 0;
      width: 5px;
      cursor: col-resize;
      user-select: none;
    }
    .resizer:hover,
    .resizing {
      border-right: 2px solid blue;
    }
  </style>

  <script type="text/javascript" src="msgpack.min.js"/>

  <script type="text/javascript" charset="utf-8">
  const createResizableColumn = function (table, col, resizer) {
    this.table = table;
      // Track the current position of mouse
      let x = 0;
      let w = 0;

      const mouseDownHandler = function (e) {
          // Get the current mouse position
          x = e.clientX;

          // Calculate the current width of column
          const styles = window.getComputedStyle(col);
          w = parseInt(styles.width, 10);

          // Attach listeners for document's events
          document.addEventListener('mousemove', mouseMoveHandler);
          document.addEventListener('mouseup', mouseUpHandler);
      };

      const mouseMoveHandler = function (e) {
          // Determine how far the mouse has been moved
          const dx = e.clientX - x;

          // Update the width of column
          col.style.width = `${w + dx}px`;

          const cols = table.querySelectorAll("."+col.className);
      // Loop over them
      [].forEach.call(cols, function (col) {
            col.style.width = `${w + dx}px`;
      });
      };

      // When user releases the mouse, remove the existing event listeners
      const mouseUpHandler = function () {
          document.removeEventListener('mousemove', mouseMoveHandler);
          document.removeEventListener('mouseup', mouseUpHandler);
      };

      resizer.addEventListener('mousedown', mouseDownHandler);
  };
  const appendResizer = function (table, cell) {

      // Create a resizer element
      const resizer = document.createElement('div');
      resizer.classList.add('resizer');

      // Set the height
      resizer.style.height = `${table.offsetHeight}px`;

      // Add a resizer element to the column
      cell.appendChild(resizer);

      // Will be implemented in the next section
      createResizableColumn(table, cell, resizer);
  };
  </script>

  <script type="text/javascript" charset="utf-8">
    window.ui = window.ui || {};

    //  @constructor
    ui.ListView = function(element, list) {
      this.el = element;
      this.cellHeight = 30;
      this.list = list;

      // Find the first element with class 'Template' and use as a row template
      var tt = this.el.getElementsByClassName('Template');
      if (tt.length > 0) {
        var t = tt[0];
        this.template = t;
        t.parentNode.removeChild(t);
      }

      this.content = document.createElement('div');
      this.el.style.overflow = 'auto';
      this.el.appendChild(this.content);
      this.cells = [];
      this.listeners = [];

      // Juggle rows on scroll
      this.el.addEventListener('scroll', this.redraw.bind(this));

      // Ensure we have enough rows.
      window.addEventListener('resize', this.redraw.bind(this));

      // Get us started
      this.redraw();
    };

    // Ensure we have enough physical lines to fill the screen
    ui.ListView.prototype.ensure = function(table, desiredCount) {
        while (this.cells.length < desiredCount) {
          var cell = new ui.Template(this, this.template);
          cell.element.style.position = 'absolute';
          cell.element.style.y = 0;
          cell.element.style.x = 0;
          cell.element.style.height = this.cellHeight + 'px';
          cell.element.style.width = '100%';
          this.content.appendChild(cell.element);
          this.cells.push(cell);
        }
      };

    // Rerender the rows
    ui.ListView.prototype.redraw = function() {
      var cellh = this.cellHeight;
      var oheight = this.el.offsetHeight;
      var top = this.el.scrollTop;
      var topRow = ~~(top / cellh);
      var len = this.list.length();

      this.content.style.height = (len * cellh) + 'px';

      var slosh = 10;

      var desiredRows = ~~(oheight / cellh + slosh);
      this.ensure(table, desiredRows);

      var start = Math.max(topRow - slosh / 2, 0);
      var end = Math.min(len, start + desiredRows);
      start = Math.max(0, end - desiredRows);

      var rows = [];

      var items = this.list.getItems(start, start + this.cells.length);
      for (var i = start; i < start + this.cells.length; i++) {
        rows.push(i);
        var cell = this.cells[i % this.cells.length];
        if (i < len) {
          var item = items[i-start];
          cell.setItem(item);
          cell.setTop(cellh * i);
          cell.element.style.display = 'block';
        } else {
          cell.element.style.display = 'none';
        }
      }
    };

    // @constructor
    ui.Template = function(listView, node) {
      this.listView = listView;
      this.db = listView.list;

      var tasks = [];
      this.tasks = tasks;

      this.element = node.cloneNode(true);

      // recursive element set up from data
      function proc(node) {
        var cc = node.childNodes;
        for (var i = 0; i < cc.length; i++) {
          var child = cc[i];
          if (child.nodeType == 3) {
        //node is a "Text"
            var m = child.textContent.match('{{(.*)}}');
            if (m) {
              var key = m[1];
              tasks.push(function(doc) {
                child.textContent = doc[key] || '';
              });
            }
          } else {
            proc(child);
          }
        }
      }
      proc(this.element);
    };

    ui.Template.prototype.setTop = function(top) {
        this.element.style.top = top + 'px';
    };

    ui.Template.prototype.setItem = function(item) {
      if (item != this.item) {
        this.item = item;
        this.tasks.forEach(function(func) { func(item); });
      }
    };
  </script>

  <script type="text/javascript" charset="utf-8">
    function initialize() {
      var list =
      {
        'length' : function() {
          return 100000;
        },
        'getItems' : function(start, end) {
            var sourceData = {
                start: start,
                end: end
            };
            var bytes = msgpack.serialize(sourceData);
            websocket.send(bytes);
            var items = [];
              for (var i=start;i<end;i++) {
                items[i-start] = {'title': 'Title '+i, 'description': 'Description '+i};
              }
          return items;
        }
      };
      var table = document.getElementById('table');
      var header = document.getElementById('header');
      const cols = header.querySelectorAll('div');
      // Loop over them
      [].forEach.call(cols, function (col) {
            appendResizer(table, col);
      });
      var listView = new ui.ListView(table, list);
    }
  </script>
   <head>
      <meta charset = utf-8>
      <title>Downcast</title>

      <body>

         <div>

            <style>

               #status {
                  padding: 5px;
                  color: #fff;
                  background: #ccc;
               }

               #status.fail {
                  background: #c00;
               }

               #status.success {
                  background: #0c0;
               }

               #status.offline {
                  background: #c00;
               }

               #status.online {
                  background: #0c0;
               }

            </style>

            <div>
               <form onsubmit = "addMessage(); return false;">
                  <input type = "text" id = "sendInput" placeholder = "Type and press enter to send" />
               </form>
               <p id = "status">Not connected</p>
               <ul id = "log"></ul>
            </div>

            <script>
               log = document.getElementById("log");
               sendInput = document.getElementById("sendInput");
               form = sendInput.form;
               state = document.getElementById("status");

               if (window.WebSocket === undefined) {
                  state.innerHTML = "sockets not supported";
                  state.className = "fail";
               }else {
                  if (typeof String.prototype.startsWith != "function") {
                     String.prototype.startsWith = function (str) {
                        return this.indexOf(str) == 0;
                     };
                  }

                  window.addEventListener("load", onLoad, false);
               }

               function onLoad() {
                  var wsUri = "ws://127.0.0.1:9999";
                  websocket = new WebSocket(wsUri);
                  websocket.onopen = function(evt) { onOpen(evt) };
                  websocket.onclose = function(evt) { onClose(evt) };
                  websocket.onmessage = function(evt) { onMessage(evt) };
                  websocket.onerror = function(evt) { onError(evt) };
               }

               function onOpen(evt) {
                  state.className = "success";
                  state.innerHTML = "Connected to server";
               }

               function onClose(evt) {
                  state.className = "fail";
                  state.innerHTML = "Not connected";
               }

               function onMessage(evt) {
                  var message = evt.data;
                  log.innerHTML = '<li class = "message">' +
                        message + "</li>" + log.innerHTML;
               }

               function onError(evt) {
                  state.className = "fail";
                  state.innerHTML = "Communication error";
               }

               function addMessage() {
                  var message = sendInput.value;
                  sendInput.value = "";
                  websocket.send(message);
               }

            </script>

         </div>

         <div id='header' class='row'>
           <div class='title'>Title</div><div class='desc'>Description</div>
         </div>
         <div id='table'>
           <!-- This is the layout for the rows, the mustache expressions are filled in with corresponding fields from "data" -->
           <div class="Template">
             <div class='title'>{{title}}</div><div class='desc'>{{description}}</div>
           </div>
         </div>
      </body>

   </head>

</html>
